[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name="aloedav"
version = "0.1.0"
description = ""
authors = [{email = "michael@aloecraft.org"}]
maintainers = [{email = "michael@aloecraft.org"}]
readme = "README.md"
# StrEnum requires 3.11 and the nested-quote f-strings in client.py and
# serial_util.py require 3.12; the package does not import below that.
requires-python = ">=3.12"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

# This tells setuptools to look for dependencies in your specific file
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["config/requirements.txt"]}

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "coverage",
    "httpx",          # starlette.testclient
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--verbose"
testpaths = [
    "src/test",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aloedav*"]
namespaces = false # Set to true if you plan to use namespace packages later